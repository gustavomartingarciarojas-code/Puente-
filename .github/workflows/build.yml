name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar
        run: gradle assembleDebug

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk puente.apk

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: puente-apk
          path: puente.apk

      - name: Publicar APK en Releases (descarga directa)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: "Última versión"
          body: "APK compilado automáticamente. Es el mismo archivo para el celular y para la tablet: descargá puente.apk e instalalo en los dos."
          files: puente.apk
